# DEMO-ONLY PostgreSQL for trying ocpaudit without an external database.
# For production, point DATABASE_URL at your managed/existing PostgreSQL.
apiVersion: v1
kind: Secret
metadata:
  name: ocpaudit-db
  namespace: ocp-audit
type: Opaque
stringData:
  url: "postgres://ocpaudit:ocpaudit@postgres.ocp-audit.svc:5432/ocpaudit?sslmode=disable"
  password: "ocpaudit"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ocp-audit
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # Sizing: ~2–3 KiB per audit record (raw JSONB dominates).
      #   size ≈ records_per_day × retention_days × 3KiB × 1.3 headroom
      # Example: 200k records/day × 30d × 3KiB ≈ 18Gi → request ~24Gi.
      # Measure your real rate first:
      #   SELECT count(*) FROM audit_records WHERE received_at > now() - interval '1 day';
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ocp-audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: ocpaudit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocpaudit-db
                  key: password
            - name: POSTGRES_DB
              value: ocpaudit
            # NFS mounts can't be chmod'ed — keep PGDATA in a subdirectory
            # so initdb doesn't try to chmod the volume root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ocp-audit
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
