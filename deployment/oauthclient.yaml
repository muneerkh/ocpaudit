# Registers ocpaudit with the OpenShift OAuth server so the UI can use
# OpenShift login. Generate a strong secret and use the SAME value in both
# resources below:
#   SECRET=$(openssl rand -hex 32)
apiVersion: oauth.openshift.io/v1
kind: OAuthClient
metadata:
  name: ocpaudit
secret: CHANGE_ME_OAUTH_SECRET          # must match ocpaudit-oauth Secret below
redirectURIs:
  # Must be https://<route-host>/auth/callback — see deploy/route.yaml.
  # Default route host is ocpaudit-ocp-audit.<apps-domain>
  - "https://ocpaudit-ocp-audit.CHANGE_ME_APPS_DOMAIN/auth/callback"
grantMethod: auto
---
apiVersion: v1
kind: Secret
metadata:
  name: ocpaudit-oauth
  namespace: ocp-audit
type: Opaque
stringData:
  client-secret: CHANGE_ME_OAUTH_SECRET  # same value as OAuthClient.secret
